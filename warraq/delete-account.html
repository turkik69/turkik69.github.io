body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#F8F3E9;color:#1B302A}.wrap{max-width:720px;margin:auto;padding:32px 18px}.card{background:#fffdf8;border:1px solid rgba(27,48,42,.1);border-radius:22px;padding:24px;box-shadow:0 18px 48px rgba(27,48,42,.08)}h1{color:#0D463A;margin-top:0}p{line-height:1.9;color:#65706a}label{display:block;margin:14px 0 6px;font-weight:700}input,textarea{width:100%;box-sizing:border-box;border:1px solid rgba(27,48,42,.15);border-radius:14px;padding:13px;background:#fffdf8;font:inherit}textarea{min-height:130px}button{width:100%;margin-top:18px;border:0;border-radius:14px;padding:13px;background:#0D463A;color:white;font:inherit;font-weight:800}.msg{margin-top:14px;padding:10px;border-radius:12px;background:#f0e9dd}.links{margin-top:18px;text-align:center}.links a{color:#0D463A}</style></head><body><div class="wrap"><div class="card"><h1>طلب حذف حساب ورّاق</h1><p>يمكنك تقديم طلب حذف حسابك وبياناتك من هنا حتى لو لم يكن التطبيق مثبتًا على جهازك. قد نحتفظ فقط بالبيانات التي يلزم الاحتفاظ بها قانونيًا أو لأغراض منع الاحتيال، وفق سياسة الخصوصية.</p><label>البريد الإلكتروني أو اسم المستخدم</label><input id="login" autocomplete="username"><label>كلمة السر</label><input id="pw" type="password" autocomplete="current-password"><button id="go">تسجيل الدخول وطلب حذف الحساب</button><div id="msg" class="msg" hidden></div></div><div class="links"><a href="./">العودة إلى ورّاق</a> · <a href="./privacy.html">الخصوصية</a> · <a href="./terms.html">الشروط</a></div></div><script>
const sb=supabase.createClient("https://eooytvurkabmiooknbgk.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvb3l0dnVya2FibWlvb2tuYmdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODY1NDcsImV4cCI6MjA5ODY2MjU0N30.deedSR1LO626DI42ANa6R9PX4USMZR_ss9SVrL_BR7s");
const m=document.getElementById("msg");const show=x=>{m.hidden=false;m.textContent=x};
document.getElementById("go").onclick=async()=>{const id=document.getElementById("login").value.trim();const pw=document.getElementById("pw").value;if(!id||!pw){show("أدخل بيانات الدخول.");return}
let email=id;
if(!id.includes("@")){const {data}=await sb.rpc("resolve_warraq_login_email",{p_identifier:id});email=data||id}
